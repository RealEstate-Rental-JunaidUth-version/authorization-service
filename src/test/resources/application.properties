# application-test.properties for auth-server
spring.cloud.config.enabled=false
spring.profiles.active=dev
spring.application.name=auth-server

# Security configuration
spring.security.oauth2.authorizationserver.issuer=${JWT_ISSUER:http://localhost:9000}

# JWT Keys (local reference)
jwt.private-key=${JWT_PRIVATE_KEY:classpath:keys/private-key.pem}
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/public-key.pem}

# Metamask login configuration
app.metamask.nonce-expiration-minutes=5
app.metamask.signature-message-prefix="Sign this message to authenticate: "

# User service connection
user.uri=${USER-MANAGEMENT-SERVICE-URL:http://localhost:8081}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
